name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install development tools without auto-installing the host peer
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Install the pi runtime the tests run against
        run: npm install --no-save --no-package-lock --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:shell
      - run: npm pack --dry-run
